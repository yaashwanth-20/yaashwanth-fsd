<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js HTTP Request Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        button {
            padding: 10px 18px;
            margin: 8px;
            border: none;
            border-radius: 5px;
            color: white;
            background: #0d6efd;
            cursor: pointer;
        }

        button:hover {
            background: #084298;
        }

        input {
            padding: 10px;
            margin: 8px;
            width: 80%;
        }

        #output {
            background: #eee;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Node.js HTTP Request Demo</h1>
    <p>Test GET, POST, PUT and DELETE requests.</p>

    <input type="text" id="name" placeholder="Enter your name">
    <br>
    <input type="text" id="course" placeholder="Enter your course">

    <div>
        <button onclick="sendRequest('GET')">GET</button>
        <button onclick="sendRequest('POST')">POST</button>
        <button onclick="sendRequest('PUT')">PUT</button>
        <button onclick="sendRequest('DELETE')">DELETE</button>
    </div>

    <h3>Server Response</h3>
    <div id="output">Response will appear here.</div>
</div>

<script>
    async function sendRequest(method) {
        const name = document.getElementById("name").value;
        const course = document.getElementById("course").value;
        const output = document.getElementById("output");

        const options = {
            method: method,
            headers: {
                "Content-Type": "application/json"
            }
        };

        if (method === "POST" || method === "PUT") {
            options.body = JSON.stringify({
                name: name,
                course: course
            });
        }

        try {
            const response = await fetch(
                method === "GET" ? "/" : "/data",
                options
            );

            const result = await response.json();
            output.textContent = JSON.stringify(result, null, 2);
        } catch (error) {
            output.textContent =
                "Error connecting to server. Please start Node.js.";
        }
    }
</script>

</body>
</html>
